name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from git tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            # Strip prerelease suffix for package.json (Marketplace requirement)
            BASE_VERSION="${VERSION%%-*}"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            BASE_VERSION="$VERSION"
          fi
          # Inject base version into package.json (without prerelease suffix)
          npm version "$BASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivid-${{ steps.version.outputs.version }}.vsix
          path: '*.vsix'

      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ steps.version.outputs.prerelease }}" == "true" ]; then
            npx vsce publish --pre-release -p ${{ secrets.VSCE_PAT }}
          else
            npx vsce publish -p ${{ secrets.VSCE_PAT }}
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
